name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Restore dependencies
        run: dotnet restore RiskMate.MathEngine/RiskMate.MathEngine.sln
        
      - name: Build
        run: dotnet build RiskMate.MathEngine/RiskMate.MathEngine.sln --configuration Release --no-restore
        
      - name: Run Tests
        run: dotnet test RiskMate.MathEngine/RiskMate.MathEngine.sln --configuration Release --no-build --verbosity normal

  # Це приклад CD, який можна активувати, додавши секрети
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      # У цьому кроці зазвичай виконується збірка та push образів у Docker Hub / AWS ECR
      - name: Build Docker images
        run: docker-compose build
        
      # А далі логіка деплою (наприклад, підключення через SSH до сервера і виконання docker-compose up)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/riskmate
            git pull origin main
            docker-compose up -d --build
